name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write

jobs:
  GoReleaser:
    permissions:
      contents: write
      packages: write
    env:
      PLUGIN_REVISION: "1"
    runs-on: namespace-profile-linux-amd64-4vcpu
    steps:
      - uses: namespacelabs/nscloud-checkout-action@v9
        with:
          fetch-depth: 0
          dissociate: true

      - uses: formancehq/ci/actions/setup-release@v1
        with:
          token: ${{ secrets.NUMARY_GITHUB_TOKEN }}

      - name: Validate Auth plugin with race detection
        run: nix develop --impure --command just test-fctl-plugin test-fctl-plugin-publisher

      - run: nix develop --impure --command just release
        env:
          GITHUB_TOKEN: ${{ secrets.NUMARY_GITHUB_TOKEN }}
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}

      - name: Publish Auth fctl plugin and release catalogue
        run: nix develop --impure --command just publish-fctl-plugin-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add the OpenAPI file to the release assets
        run: nix develop --impure --command just upload-release-openapi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
